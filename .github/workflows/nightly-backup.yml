name: Back up catalog nightly

on:
  schedule:
    # Runs at both UTC offsets to accommodate Detroit daylight-saving time.
    - cron: '5 4,5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: choir-catalog-pages
  cancel-in-progress: true

jobs:
  backup-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out catalog
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create backup
        run: node scripts/nightly-backup.mjs
        env:
          FORCE_BACKUP: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}

      - name: Commit backup when changed
        id: backup
        run: |
          if git diff --quiet -- backups/latest-data.csv public/backup-status.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No backup changes to commit."
            exit 0
          fi

          git config user.name "Choir Catalog Automation"
          git config user.email "actions@users.noreply.github.com"
          git add backups/latest-data.csv public/backup-status.json
          git commit -m "Create nightly choir catalog backup"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Build site
        if: steps.backup.outputs.changed == 'true'
        run: npm run build

      - name: Configure GitHub Pages
        if: steps.backup.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        if: steps.backup.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        if: steps.backup.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
